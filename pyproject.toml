[project]
name = "flowplan"
version = "1.1.0"
description = "FlowPlan: abstraction-guided planning and verification for coding agents. Per-function control-flow / data-flow graphs served as MCP tools, with the evaluation harness for SWE-bench Pro, SWE-bench Verified, and SecBench."
requires-python = ">=3.12"
dependencies = [
    # FlowPlan server + harness
    "mcp==1.27.2",
    "networkx==3.6.1",
    "beniget==0.5.0",
    "gast==0.7.0",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
    "tiktoken==0.13.0",
    "pyarrow==24.0.0",        # SWE-bench Verified instance loader (HF parquet)
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    # compared methods (related_works/README.md)
    "httpx==0.28.1",          # AgentDiet / SeeRepo request proxies, SWE-Pruner wrappers
    "aiohttp==3.14.3",        # AgentDiet / SeeRepo request proxies
    "jinja2==3.1.6",          # EET experience template
    "pillow==12.2.0",         # SeeRepo graph image
    "graphviz==0.21",         # SeeRepo graph rendering (also needs the `dot` binary)
    "typer==0.27.0",          # imported by the SeeRepo graph code
    "rich==15.0.0",           # imported by the EET / SeeRepo mini-swe-agent forks
    "python-dotenv==1.2.2",   # same
    "platformdirs==4.11.8",   # same
]

# The code runs from the repo root (`python -m` resolves the `experiments`,
# `servers`, `indexer`, and `perrep` packages from the current working
# directory), so nothing is packaged: `pip install -e .` installs only the
# pinned dependencies above.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
