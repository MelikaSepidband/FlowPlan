[project]
name = "flow-graph-tools"
version = "1.0.0"
description = "Flow-first code representations (CFG/DFG) as MCP tools for coding agents: baseline vs cfg/dfg/cfgdfg flow arms on SWE-bench Pro, SWT-bench, and SecBench."
requires-python = ">=3.12"
dependencies = [
    "mcp==1.27.2",
    "networkx==3.6.1",
    "beniget==0.5.0",
    "gast==0.7.0",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
    "tiktoken==0.13.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

# No build backend: code runs from the repo root; `python -m` resolves the
# `experiments`, `servers`, `indexer`, and `perrep` packages from the current
# working directory.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
